[package]
name = "everythingapp-device"
version = "0.1.1"
description = "EverythingApp Device: tray app that hosts the device agent"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "everythingapp_device_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Plain `C:\...` paths instead of verbatim `\\?\C:\...` ones, which Node cannot resolve a main module from.
dunce = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
url = "2"
time = { version = "0.3", features = ["formatting"] }
gethostname = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
