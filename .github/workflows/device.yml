name: Device

# Device bridge: the Node agent (device/agent) and the Tauri tray app (device/app).
# Pushes and pull requests touching device/** run the checks; a tag device-vX.Y.Z builds the installers for every
# platform into a draft GitHub release (unsigned until signing credentials are added below). The same release build can be
# started from the Actions tab ("Run workflow") with a version; the tag is then created by the release itself.

on:
  push:
    branches: [main, 'wip/**']
    tags: ['device-v*']
    paths:
      - 'device/**'
      - '.github/workflows/device.yml'
  pull_request:
    paths:
      - 'device/**'
      - '.github/workflows/device.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the prefix, e.g. 0.1.0 (published as tag device-v<version>)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  agent:
    name: agent (typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            device/agent/package-lock.json
            playwright-mcp/package-lock.json
      # The agent bundles playwright-mcp's sources, so their dependencies must be installed too.
      - run: npm ci
        working-directory: playwright-mcp
      - run: npm ci
        working-directory: device/agent
      - run: npm run typecheck
        working-directory: device/agent
      - run: npm test
        working-directory: device/agent

  tauri-check:
    name: tray app (cargo check, clippy, fmt, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device/app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device/app/src-tauri
      # tauri-build insists that the sidecar exists; a placeholder is enough to compile.
      - name: Placeholder sidecar
        run: touch binaries/evvapp-node-x86_64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  release:
    name: release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/device-v') || github.event_name == 'workflow_dispatch'
    needs: [agent, tauri-check]
    runs-on: ${{ matrix.os }}
    # The only job that writes to the repository (draft release assets).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'msi,nsis' }
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: 'dmg' }
          - { os: macos-13, target: x86_64-apple-darwin, bundles: 'dmg' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,appimage' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            device/app/package-lock.json
            device/agent/package-lock.json
            playwright-mcp/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device/app/src-tauri
          key: ${{ matrix.target }}
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config build-essential
      - run: npm ci
        working-directory: device/app
      - name: Fetch the Node runtime (sidecar)
        run: node scripts/fetch-node.mjs --target ${{ matrix.target }}
        working-directory: device/app
      - name: Build and stage the agent
        run: node scripts/stage-agent.mjs
        working-directory: device/app
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (add the secrets, then uncomment):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: device/app
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && format('device-v{0}', inputs.version) || github.ref_name }}
          releaseName: ${{ format('EverythingApp Device {0}', github.event_name == 'workflow_dispatch' && format('device-v{0}', inputs.version) || github.ref_name) }}
          releaseBody: 'Unsigned installers. Windows: SmartScreen may warn; macOS: allow the app in System Settings > Privacy & Security.'
          releaseDraft: true
          prerelease: false
