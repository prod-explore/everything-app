# Weekly dependency updates. Minor and patch updates of one package are grouped into a single pull request.
# Major versions (a new TypeScript, a new Node typings line, a new Ubuntu) are chosen by hand, so they are ignored here;
# `npm audit` in CI still fails the build on a high or critical advisory, which is what forces an earlier major bump.
version: 2

updates:
  # ── npm: one entry per package, each with its own lockfile ──────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /cli
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /git-proxy
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /sandbox-mcp
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /sandbox-supervisor
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /playwright-mcp
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Dockerfile's PLAYWRIGHT_IMAGE_TAG has to equal the locked playwright version (a test checks it),
      # so playwright is bumped by hand, together with the image tag.
      - dependency-name: playwright
      - dependency-name: playwright-core

  # ── Docker base images ──────────────────────────────────────────────────────────────────────────────────────────
  # Major Node releases are chosen by hand, the rest of the tag follows Dependabot.
  - package-ecosystem: docker
    directory: /cli
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(docker)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /git-proxy
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(docker)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /sandbox-mcp
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(docker)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /sandbox-supervisor
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(docker)" }
    groups:
      minor-and-patch: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # The image the code sandboxes run in.
  - package-ecosystem: docker
    directory: /sandbox-supervisor/sandbox-image
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(docker)" }
    ignore:
      # LTS releases only, and by hand: 24.10 and the other interim releases look like minor updates to Dependabot.
      - dependency-name: ubuntu

  - package-ecosystem: docker
    directory: /playwright-mcp
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(docker)" }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Kept equal to the locked playwright package (see above).
      - dependency-name: mcr.microsoft.com/playwright

  # ── GitHub Actions ──────────────────────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }
